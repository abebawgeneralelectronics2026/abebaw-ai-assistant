
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101522">
<title>ABEB AW AI ASSISTANT</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
}
main {
  max-width: 650px;
  margin: 25px auto;
  background: #192235;
  padding: 22px;
  border-radius: 18px;
  border: 1px solid #d4af37;
}
h1 {
  color: #d4af37;
  text-align: center;
  font-size: 25px;
}
.subtitle {
  text-align: center;
  color: #b8c4d8;
}
#status {
  text-align: center;
  color: #d4af37;
  font-size: 13px;
  margin: 18px 0;
}
#chat {
  height: 330px;
  overflow-y: auto;
  background: #101522;
  border-radius: 12px;
  padding: 12px;
}
.message {
  padding: 12px;
  margin: 9px 0;
  border-radius: 10px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.user {
  background: #294568;
  margin-left: 25px;
}
.ai {
  background: #293449;
  margin-right: 25px;
}
textarea {
  width: 100%;
  margin-top: 15px;
  padding: 13px;
  border-radius: 10px;
  background: #101522;
  color: white;
  border: 1px solid #53647d;
  font-size: 16px;
  resize: vertical;
}
button {
  background: #d4af37;
  color: #101522;
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}
#send {
  width: 100%;
  margin-top: 10px;
}
button:disabled { opacity: .5; }
footer {
  text-align: center;
  color: #91a0b8;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>
<body>
<main>
  <h1>ABEB AW AI</h1>
  <p class="subtitle">Your assistant. Your choices. Your control.</p>

  <div id="status">Ready to connect</div>

  <div id="chat" aria-live="polite">
    <div class="message ai">
      Hello! I am ABEB AW AI, created by Abebaw.
      How can I help you today?
    </div>
  </div>

 <textarea id="message" rows="3"
    placeholder="Write or speak your message here..."></textarea>

<div style="display:flex; gap:10px; margin-top:10px;">
  <button id="mic" onclick="toggleMicrophone()"
    style="flex:1; background:#27ae60; color:white;">
    🎤 SPEAK
  </button>

  <button id="send" onclick="sendMessage()" style="flex:2; margin:0;">
    SEND MESSAGE
  </button>
</div>
  <footer>ABEB AW AI · Prototype 1.0 · Founder: Abebaw</footer>
</main>

<script>
const chat = document.getElementById("chat");
const message = document.getElementById("message");
const statusText = document.getElementById("status");
const sendButton = document.getElementById("send");

// API connection will be added after the interface is tested.

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;
let isListening = false;

function toggleMicrophone() {
  if (!SpeechRecognition) {
    statusText.textContent =
      "Voice recognition is not supported. Try Google Chrome.";
    return;
  }

  if (isListening) {
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = navigator.language || "en-US";
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = function() {
    isListening = true;
    document.getElementById("mic").textContent = "⏹ STOP LISTENING";
    statusText.textContent = "ABEB AW AI is listening...";
  };

  recognition.onresult = function(event) {
    let transcript = "";

    for (let i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }

    message.value = transcript;
  };

  recognition.onerror = function(event) {
    statusText.textContent =
      "Microphone error: " + event.error;
  };

  recognition.onend = function() {
    isListening = false;
    document.getElementById("mic").textContent = "🎤 SPEAK";

    if (statusText.textContent === "ABEB AW AI is listening...") {
      statusText.textContent = "Voice captured. Ready to send.";
    }
  };

  recognition.start();
}






function addMessage(text, type) {
  const item = document.createElement("div");
  item.className = "message " + type;

  const lines = String(text).split("\n");
  let currentList = null;
  let inCodeBlock = false;
  let codeLines = [];

  function closeList() {
    currentList = null;
  }

  function addInlineText(element, text) {
    const regex = /(\*\*.*?\*\*|`[^`]+`|\*[^*]+\*)/g;
    let lastIndex = 0;
    let match;

    while ((match = regex.exec(text)) !== null) {
      element.appendChild(
        document.createTextNode(text.slice(lastIndex, match.index))
      );

      const token = match[0];

      if (token.startsWith("**")) {
        const strong = document.createElement("strong");
        strong.textContent = token.slice(2, -2);
        element.appendChild(strong);
      } else if (token.startsWith("`")) {
        const code = document.createElement("code");
        code.textContent = token.slice(1, -1);
        code.style.background = "#101522";
        code.style.padding = "2px 5px";
        code.style.borderRadius = "4px";
        element.appendChild(code);
      } else {
        const italic = document.createElement("em");
        italic.textContent = token.slice(1, -1);
        element.appendChild(italic);
      }

      lastIndex = regex.lastIndex;
    }

    element.appendChild(
      document.createTextNode(text.slice(lastIndex))
    );
  }

  function addCodeBlock() {
    const wrapper = document.createElement("div");
    wrapper.style.margin = "12px 0";

    const copyButton = document.createElement("button");
    copyButton.textContent = "📋 Copy code";
    copyButton.style.padding = "7px 12px";
    copyButton.style.marginBottom = "6px";
    copyButton.style.fontSize = "12px";

    const pre = document.createElement("pre");
    const code = document.createElement("code");

    const codeText = codeLines.join("\n");
    code.textContent = codeText;

    pre.style.background = "#101522";
    pre.style.color = "#d4af37";
    pre.style.padding = "12px";
    pre.style.borderRadius = "8px";
    pre.style.overflowX = "auto";
    pre.style.whiteSpace = "pre";

    pre.appendChild(code);

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(codeText);
        copyButton.textContent = "✓ Copied!";
      } catch (error) {
        copyButton.textContent = "Copy failed";
      }
    });

    wrapper.appendChild(copyButton);
    wrapper.appendChild(pre);
    item.appendChild(wrapper);

    codeLines = [];
  }

  lines.forEach(line => {
    if (line.trim().startsWith("```")) {
      if (inCodeBlock) {
        addCodeBlock();
        inCodeBlock = false;
      } else {
        closeList();
        inCodeBlock = true;
      }
      return;
    }

    if (inCodeBlock) {
      codeLines.push(line);
      return;
    }

    if (!line.trim()) {
      closeList();
      return;
    }

    const heading = line.match(/^(#{1,3})\s+(.+)$/);

    if (heading) {
      closeList();

      const level = heading[1].length;
      const title = document.createElement("h" + level);

      title.style.color = "#d4af37";
      title.style.margin = "12px 0 7px";

      addInlineText(title, heading[2]);
      item.appendChild(title);
      return;
    }

    const bullet = line.match(/^\s*[-*]\s+(.+)$/);
    const numbered = line.match(/^\s*\d+[.)]\s+(.+)$/);

    if (bullet || numbered) {
      const isNumbered = !!numbered;
      const listType = isNumbered ? "ol" : "ul";

      if (!currentList || currentList.tagName.toLowerCase() !== listType) {
        closeList();
        currentList = document.createElement(listType);
        currentList.style.paddingLeft = "22px";
        item.appendChild(currentList);
      }

      const li = document.createElement("li");
      li.style.margin = "5px 0";

      addInlineText(li, (bullet || numbered)[1]);
      currentList.appendChild(li);
      return;
    }

    closeList();

    const paragraph = document.createElement("p");
    paragraph.style.margin = "7px 0";

    addInlineText(paragraph, line);
    item.appendChild(paragraph);
  });

  if (inCodeBlock) {
    addCodeBlock();
  }

  if (type === "ai") {
    const voiceControls = document.createElement("div");
    voiceControls.style.marginTop = "8px";

    const speakerButton = document.createElement("button");
    speakerButton.textContent = "🔊 Listen";
    speakerButton.style.padding = "8px 12px";
    speakerButton.style.marginRight = "8px";

    speakerButton.addEventListener("click", function() {
      speakAnswer(String(text));
    });

    const stopButton = document.createElement("button");
    stopButton.textContent = "⏹ Stop Speaking";
    stopButton.style.padding = "8px 12px";

    stopButton.addEventListener("click", function() {
      stopSpeaking();
      statusText.textContent = "ABEB AW AI is connected.";
    });

    voiceControls.appendChild(speakerButton);
    voiceControls.appendChild(stopButton);
    item.appendChild(voiceControls);
  }

  chat.appendChild(item);
  chat.scrollTop = chat.scrollHeight;
}
function stopSpeaking() {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
}

function speakAnswer(text) {
  if (!("speechSynthesis" in window)) {
    statusText.textContent = "Voice playback is not supported.";
    return;
  }

  stopSpeaking();

  const utterance = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();

  // Detect the language from the AI's response.
  function detectLanguage(text) {
    if (/[\u1200-\u137F]/.test(text)) return "am-ET";
    if (/[\u0600-\u06FF]/.test(text)) return "ar";
    if (/[\u0400-\u04FF]/.test(text)) return "ru";
    if (/[\u4E00-\u9FFF]/.test(text)) return "zh";
    if (/[\u3040-\u30FF]/.test(text)) return "ja";
    if (/[\uAC00-\uD7AF]/.test(text)) return "ko";
    if (/\b(hola|gracias|español)\b/i.test(text)) return "es";
    if (/\b(bonjour|merci|français)\b/i.test(text)) return "fr";
    if (/\b(hallo|danke|deutsch)\b/i.test(text)) return "de";

    return "en";
  }

  const language = detectLanguage(text);
  utterance.lang = language;

  const matchingVoice = voices.find(
    voice => voice.lang.toLowerCase() === language.toLowerCase()
  ) || voices.find(
    voice => voice.lang.toLowerCase().startsWith(language.split("-")[0])
  );

  if (matchingVoice) {
    utterance.voice = matchingVoice;
  }

  utterance.onstart = function() {
    statusText.textContent = "ABEB AW AI is speaking...";
  };

  utterance.onend = function() {
    statusText.textContent = "ABEB AW AI is connected.";
  };

  utterance.onerror = function(event) {
    console.error("Voice Error:", event.error);
    statusText.textContent = "Voice playback unavailable.";
  };

  speechSynthesis.speak(utterance);
}


async function sendMessage() {
  const userText = message.value.trim();
  if (!userText) return;

  stopSpeaking();

  addMessage(userText, "user");
  message.value = "";

  statusText.textContent = "ABEB AW AI is thinking...";

  try {
    const response = await fetch(
      "https://abeb-aw-ai-brain.jacksonabebe98.workers.dev",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: userText
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI connection failed");
    }

    const reply = data.reply || data.response;

    if (!reply) {
      throw new Error("No AI response received.");
    }

    addMessage(reply, "ai");

    statusText.textContent = "ABEB AW AI is connected.";

  } catch (error) {
    console.error("AI Error:", error);

    addMessage(
      "Connection failed: " + error.message,
      "ai"
    );

    statusText.textContent = "Connection problem.";
  }
}

</script>
</body>
</html>
