
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101522">
<title>ABEB AW AI ASSISTANT</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
}
main {
  max-width: 650px;
  margin: 25px auto;
  background: #192235;
  padding: 22px;
  border-radius: 18px;
  border: 1px solid #d4af37;
}
h1 {
  color: #d4af37;
  text-align: center;
  font-size: 25px;
}
.subtitle {
  text-align: center;
  color: #b8c4d8;
}
#status {
  text-align: center;
  color: #d4af37;
  font-size: 13px;
  margin: 18px 0;
}
#chat {
  height: 330px;
  overflow-y: auto;
  background: #101522;
  border-radius: 12px;
  padding: 12px;
}
.message {
  padding: 12px;
  margin: 9px 0;
  border-radius: 10px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.user {
  background: #294568;
  margin-left: 25px;
}
.ai {
  background: #293449;
  margin-right: 25px;
}
textarea {
  width: 100%;
  margin-top: 15px;
  padding: 13px;
  border-radius: 10px;
  background: #101522;
  color: white;
  border: 1px solid #53647d;
  font-size: 16px;
  resize: vertical;
}
button {
  background: #d4af37;
  color: #101522;
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}
#send {
  width: 100%;
  margin-top: 10px;
}
button:disabled { opacity: .5; }
footer {
  text-align: center;
  color: #91a0b8;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>
<body>
<main>
  <h1>ABEB AW AI</h1>
  <p class="subtitle">Your assistant. Your choices. Your control.</p>

  <div id="status">Ready to connect</div>

  <div id="chat" aria-live="polite">
    <div class="message ai">
      Hello! I am ABEB AW AI, created by Abebaw.
      How can I help you today?
    </div>
  </div>

  <textarea id="message" rows="3"
    placeholder="Write your message here..."></textarea>

  <button id="send" onclick="sendMessage()">SEND MESSAGE</button>

  <footer>ABEB AW AI · Prototype 1.0 · Founder: Abebaw</footer>
</main>

<script>
const chat = document.getElementById("chat");
const message = document.getElementById("message");
const statusText = document.getElementById("status");
const sendButton = document.getElementById("send");

// API connection will be added after the interface is tested.




function addMessage(text, type) {
  const item = document.createElement("div");
  item.className = "message " + type;

  const lines = String(text).split("\n");

  lines.forEach(line => {
    const paragraph = document.createElement("p");
    paragraph.style.margin = "5px 0";

    // Bold, italic and inline code formatting
    const regex = /(\*\*.*?\*\*|\*[^*]+\*|`[^`]+`)/g;

    let lastIndex = 0;
    let match;

    while ((match = regex.exec(line)) !== null) {
      paragraph.appendChild(
        document.createTextNode(line.slice(lastIndex, match.index))
      );

      const token = match[0];

      if (token.startsWith("**")) {
        const strong = document.createElement("strong");
        strong.textContent = token.slice(2, -2);
        paragraph.appendChild(strong);
      } else if (token.startsWith("*")) {
        const italic = document.createElement("em");
        italic.textContent = token.slice(1, -1);
        paragraph.appendChild(italic);
      } else {
        const code = document.createElement("code");
        code.textContent = token.slice(1, -1);
        paragraph.appendChild(code);
      }

      lastIndex = regex.lastIndex;
    }

    paragraph.appendChild(
      document.createTextNode(line.slice(lastIndex))
    );

    item.appendChild(paragraph);
  });

  chat.appendChild(item);
  chat.scrollTop = chat.scrollHeight;
}





async function sendMessage() {
  const userText = message.value.trim();
  if (!userText) return;

  addMessage(userText, "user");
  message.value = "";

  statusText.textContent = "Connecting to ABEB AW AI...";

  try {
    const response = await fetch(
      "https://abeb-aw-ai-brain.jacksonabebe98.workers.dev",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: userText
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI connection failed");
    }

    const reply = data.reply || data.response;

    if (!reply) {
      throw new Error("No AI response received.");
    }

    addMessage(reply, "ai");
    statusText.textContent = "ABEB AW AI is connected.";

  } catch (error) {
    console.error("AI Error:", error);
    addMessage(
      "Connection failed: " + error.message,
      "ai"
    );
    statusText.textContent = "Connection problem.";
  }
}


message.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
