name: ABEB AW AI Android Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'abebaw-ai-android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p abebaw-ai-android/app/build/release
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > abebaw-ai-android/app/build/release/abebaw-release.jks
          test -s abebaw-ai-android/app/build/release/abebaw-release.jks

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: gradle -p abebaw-ai-android assembleRelease

      - name: Save signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ABEB-AW-AI-Phone-Control-Signed-APK
          path: abebaw-ai-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
